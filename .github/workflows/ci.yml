name: validation

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils de validation
        run: sudo apt-get update && sudo apt-get install -y shellcheck gcc binutils xz-utils
      - name: Vérifier les livrables
        run: make check

